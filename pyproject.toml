[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exception-pilot"
version = "0.1.0"
description = "A staged pilot of reasoning and learning verified exceptions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
exception-pilot = "exception_pilot.__main__:main"
exception-counterfactual = "exception_counterfactual.__main__:main"
exception-wording = "exception_wording.__main__:main"
exception-factorial = "exception_factorial.__main__:main"
exception-explanation = "exception_explanation.__main__:main"
exception-missingness = "exception_missingness.__main__:main"
exception-cue = "exception_cue.__main__:main"
exception-constrained-cue = "exception_constrained_cue.__main__:main"
exception-order = "exception_order.__main__:main"
exception-revision = "exception_revision.__main__:main"
exception-prefix = "exception_prefix.__main__:main"
exception-mistral-prefix = "exception_mistral_prefix.__main__:main"
exception-mistral-prefix-v2 = "exception_mistral_prefix_v2.__main__:main"
exception-mistral-map = "exception_mistral_map.__main__:main"
exception-mistral-map-v2 = "exception_mistral_map_v2.__main__:main"
exception-mistral-map-v3 = "exception_mistral_map_v3.__main__:main"
exception-mistral-framing = "exception_mistral_framing.__main__:main"
exception-query-role = "exception_query_role.__main__:main"

[tool.setuptools.packages.find]
include = ["exception_pilot*", "exception_counterfactual*", "exception_wording*", "exception_factorial*", "exception_explanation*", "exception_missingness*", "exception_cue*", "exception_constrained_cue*", "exception_order*", "exception_revision*", "exception_prefix*", "exception_mistral_prefix*", "exception_mistral_map*", "exception_mistral_framing*", "exception_query_role*"]
